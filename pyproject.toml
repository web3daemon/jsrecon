[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsrecon"
version = "0.1.0"
description = "Map a web app's JavaScript to its API — endpoints, GraphQL, routes, source maps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "web3daemon" }]
keywords = [
    "reverse-engineering", "javascript", "api", "openapi", "source-maps",
    "bug-bounty", "recon", "security", "mcp", "graphql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jsrecon = "jsrecon.cli:main"

[project.urls]
Homepage = "https://github.com/web3daemon/jsrecon"
Issues = "https://github.com/web3daemon/jsrecon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jsrecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
